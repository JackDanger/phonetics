name: Release

# Triggered by pushing a git tag of the form `v0.1.0`. Each registry's
# upload step skips on pre-release tags (`v0.1.0-rc1`) so you can
# rehearse the build pipeline without burning a version slot.
on:
  push:
    tags:
      - 'v*'

jobs:
  # ----------------------------------------------------------------
  # crates.io: source-only publish of the `phonetics` core crate.
  # Uses a registry token because crates.io doesn't yet support OIDC
  # trusted publishing.
  # ----------------------------------------------------------------
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        working-directory: rust/phonetics
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Pre-release tag — running cargo publish --dry-run."
            cargo publish --dry-run
          else
            cargo publish --token "${CARGO_REGISTRY_TOKEN}"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ----------------------------------------------------------------
  # PyPI: trusted-publisher / OIDC flow.
  #
  # Stage 1 builds platform wheels in parallel (linux x86_64, macOS
  # arm64, macOS x86_64, windows x64) plus an sdist on Linux. Each
  # job uploads its dist/ directory as a GitHub Actions artifact.
  #
  # Stage 2 downloads all artifacts and publishes them via the
  # official `pypa/gh-action-pypi-publish` action, which mints an
  # OIDC token bound to this exact workflow + environment and hands
  # it to PyPI. The PyPI project must have a Trusted Publisher
  # configured with:
  #   Owner          : JackDanger
  #   Repository name: phonetics
  #   Workflow name  : release.yml
  #   Environment    : pypi
  # See https://docs.pypi.org/trusted-publishers/.
  # ----------------------------------------------------------------
  # Build platform wheels in parallel. Each matrix entry produces one
  # wheel and uploads it as a GHA artifact.
  build-pypi-wheels:
    name: Build wheel (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14
            target: aarch64
          # macos-13 (Intel) runners are deprecated and frequently
          # queue for 10+ minutes. Apple Silicon is the practical
          # macOS target now; Intel-Mac users install from sdist.
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/phonetics-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist
          # Use manylinux container on Linux for portable wheels.
          manylinux: ${{ runner.os == 'Linux' && 'auto' || '' }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/phonetics-py/dist/

  # sdist is built in its own job — running it inside the manylinux
  # matrix entry caused permission clashes between the container's
  # root-owned wheel directory and the host user trying to write the
  # tarball after.
  build-pypi-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/phonetics-py
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-sdist
          path: python/phonetics-py/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build-pypi-wheels, build-pypi-sdist]
    runs-on: ubuntu-latest
    # Pre-release tags build the wheels but skip the upload entirely
    # so we don't burn a version on rehearsal.
    if: ${{ !contains(github.ref_name, '-') }}
    # The `pypi` environment must exist on the GitHub repo (Settings ->
    # Environments). PyPI's trusted-publisher config binds *this exact
    # workflow + environment name* to publishing rights for the package.
    environment:
      name: pypi
      url: https://pypi.org/project/phonetics/
    permissions:
      id-token: write   # required for OIDC; no API token needed.
    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-dist-*
          merge-multiple: true
          path: dist/
      - name: List contents
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # ----------------------------------------------------------------
  # RubyGems: cross-compiled native gems for the major platforms,
  # plus the source gem for everything else. The Rakefile defines
  # tasks via `rb_sys/extensiontask`; `rb-sys-dock` runs the build
  # inside the right cross-compiler container per platform.
  # ----------------------------------------------------------------
  publish-rubygems:
    name: Publish to RubyGems (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby
      - uses: dtolnay/rust-toolchain@stable
      # oxidize-rb cross-gem mounts ~/.cargo/registry into the build
      # container. The mount fails if the directory doesn't exist on
      # the host yet — a fresh runner hasn't necessarily touched cargo.
      - name: Ensure cargo registry exists for docker mount
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.2,3.3,3.4'
          working-directory: ruby
      - name: push native gem
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: ruby
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "${GEM_HOST_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          for gem in pkg/*-${{ matrix.platform }}.gem; do
            [ -f "$gem" ] || continue
            gem push "$gem" || echo "(push failed; likely already exists)"
          done
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}

  publish-rubygems-source:
    name: Publish source gem to RubyGems
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby
      - name: build source gem
        working-directory: ruby
        run: bundle exec rake build
      - name: push source gem
        working-directory: ruby
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "${GEM_HOST_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          for gem in pkg/*.gem; do
            # Source gem (no platform suffix). Skip native gems if any
            # snuck into pkg/ from cached state.
            case "$gem" in
              *-arm64-darwin*|*-x86_64-darwin*|*-x86_64-linux*|*-aarch64-linux*|*-mingw*)
                continue ;;
            esac
            gem push "$gem" || echo "(push failed; likely already exists)"
          done
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
