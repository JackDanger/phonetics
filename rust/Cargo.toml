# Cargo workspace for the phonetics Rust port.
#
# Three crates with a clean dependency direction:
#
#   phonetics        the language-agnostic core. Publishable to crates.io.
#                    No FFI, no Ruby, no Python — just IPA-distance math.
#
#   phonetics-ruby   Magnus bindings around `phonetics`. Built as a Ruby
#                    extension; ships in the gem.
#
#   phonetics-py     PyO3 bindings around `phonetics`. Built with maturin;
#                    ships as a wheel.
#
# The bindings crates only thin-wrap the core API. All algorithm changes
# happen in `phonetics` and propagate automatically.
[workspace]
resolver = "2"
members = [
    "phonetics",
]

# The Ruby binding crate lives at <repo>/ruby/ext/phonetics/ where the
# gem's extconf.rb builds it. It's standalone (no workspace
# inheritance) so it builds equally well from a git checkout or from
# a `gem install`-extracted tree where the workspace root isn't
# available.

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JackDanger/phonetics"
homepage = "https://github.com/JackDanger/phonetics"
authors = ["Jack Danger <github@jackcanty.com>"]

[workspace.lints.rust]
unused_must_use = "deny"

# Default-on clippy is on. We don't run pedantic in CI because most of
# its complaints (missing backticks in docstrings, identical match
# arms, wildcard enum-variant imports) are noise in a math-heavy
# crate where the readable form often hits the lint. The non-pedantic
# levels still catch real bugs.
[workspace.lints.clippy]

[profile.release]
lto = "thin"
codegen-units = 1
